[[permission]]
identifier = "allow-app-commands"
description = "Allow all application commands"
commands.allow = [
  "create_task",
  "update_task",
  "delete_task",
  "list_tasks",
  "reorder_tasks",
  "get_settings",
  "save_settings",
  "test_llm_connection",
  "enqueue_analysis",
  "get_task_analysis",
  "list_digests",
  "get_digest",
  "generate_digest_now",
  "show_quick_capture",
  "show_main_window",
  "show_settings_window",
  "show_digests_window",
  "hide_window",
  "register_hotkey",
]
