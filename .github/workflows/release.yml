name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    name: Check main branch
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure this commit is on main
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          on_main=false
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            on_main=true
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual run is only allowed from main (got $GITHUB_REF)."
            on_main=false
          fi

          if [ "$on_main" = true ]; then
            echo "Release allowed: $GITHUB_SHA is on origin/main."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping release: $GITHUB_SHA ($GITHUB_REF) is not on main."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Micro Task Tracker v__VERSION__
          releaseBody: |
            ## Micro Task Tracker v__VERSION__

            Скачайте установщик для вашей платформы из Assets.

            | Platform | Artifact |
            |----------|----------|
            | Windows | `.msi` / `.exe` |
            | macOS Apple Silicon | `.dmg` / `.app.tar.gz` (aarch64) |
            | macOS Intel | `.dmg` / `.app.tar.gz` (x86_64) |
            | Linux | `.deb` / `.AppImage` |

            > macOS builds are unsigned (Gatekeeper may warn). Windows builds are unsigned unless signing secrets are configured.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
